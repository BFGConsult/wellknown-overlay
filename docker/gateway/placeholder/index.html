<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Automatic Configuration Endpoint</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f8fb;
      color: #1a1d24;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    main {
      max-width: 40rem;
      border: 1px solid #d7dce5;
      border-radius: 8px;
      padding: 32px;
      background: #fff;
      box-shadow: 0 16px 40px rgb(19 27 45 / 0.08);
    }

    h1 {
      margin: 0 0 1rem;
      font-size: 2rem;
      line-height: 1.15;
    }

    p {
      margin: 0;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <h1>Automatic configuration endpoint</h1>
    <p>
      wellknown-overlay is running. This host serves standards-based discovery
      documents for mail clients and other well-known paths. There is no
      website here.
    </p>
  </main>
</body>
</html>
